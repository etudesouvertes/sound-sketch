services:
  web:
    build: .
    ports:
      - "5180:5173"
    environment:
      # スマホで開くための LAN のアドレス（Windows の Wi-Fi の IP）。QR コードに使う。.env に LAN_HOST=… と書く
      LAN_HOST: ${LAN_HOST:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # 投稿用の動画を録る（recorder/record.mjs）。web と同じネットワークで、開発サーバーを localhost として開く
  recorder:
    build: ./recorder
    profiles: [record]
    network_mode: service:web
    user: "${UID:-1000}:${GID:-1000}" # 書き出したファイルを、自分の持ち物にする
    environment:
      HOME: /tmp
    depends_on: [web]
    volumes:
      - ./recordings:/recordings
      - ./recorder/record.mjs:/recorder/record.mjs:ro

volumes:
  node_modules:
